// Projeto de um módulo só: o aplicativo. Nenhuma biblioteca de terceiros entra aqui — o pacote é o
// site de dist/ dentro de um WebView, e tudo o que ele usa vem do próprio Android.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'ai-security-lab'
include ':app'
